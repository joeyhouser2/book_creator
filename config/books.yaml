# Real, buildable book definitions (see config/books.example.yaml for a fuller
# annotated reference). Run with:
#   python make_book.py config/books.yaml

books:
  - title: "Le Rouge et le Noir"
    author: "Stendhal"
    src_lang: fr          # French original
    tgt_lang: en
    src_gutenberg_id: 798     # Le rouge et le noir, French
    tgt_gutenberg_id: 44747   # Horace B. Samuel translation, 1916 (public domain)
    mode: prose
    aligner: auto
    # Division 1 is front matter on both sides — on the English edition it's
    # Samuel's own 1916 translator's introduction (no French counterpart), so
    # it's excluded rather than force-aligned. 2-76 is the 75 real chapters,
    # matched 1:1 on both sides (run --outline to re-check after a Gutenberg
    # text update).
    src_range: 2-76
    tgt_range: 2-76
    first: src            # French line first, then English
    trim: [6.0, 9.0]
    translation_pd_confirmed: true
    translation_source_note: "Horace B. Samuel, 1916 — public domain."
    font: OldStandard   # more distinctive antique-book character than Cardo
    decorations:
      margin: corners
      chapter: victorian     # ornate 19th-century scrollwork, fits an 1830 novel
      color: "#31437a"       # royal azure, matches the French cover motif
      opener_font: uncialantiqua   # decorative face for each chapter's opening line
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      translator: "Horace B. Samuel"
    cover:
      paper: white
      blurb: "Stendhal's chronicle of ambition and desire in Restoration France, with the original French and Horace B. Samuel's classic 1916 English translation on facing lines."
    epub: true

  - title: "Notre-Dame de Paris"
    author: "Victor Hugo"
    src_lang: fr
    tgt_lang: en
    src_gutenberg_id: 19657    # Notre-Dame de Paris, French
    tgt_gutenberg_id: 2610     # Isabel F. Hapgood translation, 1888 (public domain)
    mode: prose
    aligner: auto
    # Both editions carry a fake front-of-book "table of contents" division
    # (French: one bloated entry ending the listing; English: a full ~50-title
    # dump) before the real text — excluded rather than force-aligned. 13-82 /
    # 72-141 is the real 11-Livre / 11-Book structure, 59 chapters + 11 book
    # headers matched 1:1 on both sides (run --outline to re-check after a
    # Gutenberg text update).
    src_range: 13-82
    tgt_range: 72-141
    first: src
    trim: [6.0, 9.0]
    translation_pd_confirmed: true
    translation_source_note: "Isabel F. Hapgood, 1888 — public domain."
    font: OldStandard    # covers the polytonic Greek chapter title (ἈΝÁΓΚΗ)
    decorations:
      margin: corners
      chapter: medieval        # vine/ivy marginalia, fits the Gothic-cathedral setting
      color: "#4a4a52"         # weathered limestone grey
      opener_font: unifrakturmaguntia   # blackletter, evokes a Gothic illuminated hand
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      translator: "Isabel F. Hapgood"
    cover:
      paper: white
      blurb: "Victor Hugo's Gothic epic of medieval Paris — Quasimodo, Esmeralda, and the cathedral that binds their fates — with the original French and Isabel F. Hapgood's 1888 English translation on facing lines."
    epub: true

  - title: "Le Père Goriot"
    author: "Honoré de Balzac"
    src_lang: fr
    tgt_lang: en
    # No standalone French edition on Gutenberg — Balzac's Comédie humaine
    # omnibus volumes bundle multiple novels per file with no chapter/title
    # heading our detector recognizes (bare untitled title lines), so this is
    # a locally extracted, verified-boundary excerpt rather than a Gutenberg
    # id: lines 12746-22772 of "La Comédie humaine - Volume 09" (gutenberg.org
    # ebook #55860), which is exactly and only Le Père Goriot (checked against
    # its "LE PÈRE GORIOT." opening heading and "FIN DU NEUVIÈME VOLUME."
    # closing marker).
    # Both this file and the English side below are trimmed to start right at
    # the real narrative ("Madame Vauquer..." / "Mme. Vauquer...") — both
    # editions carry their own title/dedication/translator-credit front
    # matter, and since neither has internal chapter headings to scope a
    # range against, leaving that front matter in gave the single-block
    # aligner unmatched fragments right at the start that it doesn't handle
    # as clean insertions; it glued them onto neighboring real sentences
    # instead (rendered as "DE BALZAC. FATHER GORIOT", the dedication's
    # signature line fused onto a title-page fragment).
    src_path: "input/pere_goriot_fr.txt"
    tgt_path: "input/pere_goriot_en.txt"   # trimmed copy of Ellen Marriage's translation, Gutenberg #1237 (public domain)
    mode: prose
    aligner: auto
    # Neither edition has internal chapter headings (Balzac wrote it as one
    # continuous narrative) — aligns as a single block across the whole novel.
    first: src
    trim: [6.0, 9.0]
    translation_pd_confirmed: true
    translation_source_note: "Ellen Marriage, 1896 — public domain."
    font: OldStandard
    decorations:
      margin: corners
      chapter: victorian
      color: "#6b2737"         # deep wine, fits the boarding-house melodrama
      opener_font: uncialantiqua
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      translator: "Ellen Marriage"
    cover:
      paper: white
      blurb: "Balzac's tragedy of paternal devotion and Parisian ambition, with the original French and Ellen Marriage's classic English translation on facing lines."
    epub: true

  - title: "Eugénie Grandet"
    author: "Honoré de Balzac"
    src_lang: fr
    tgt_lang: en
    # No standalone Gutenberg id: src is a locally trimmed copy of #11049 with
    # the title page, byline, and Balzac's "À Maria" dedication cut (see
    # input/eugenie_grandet_fr.txt) — Wormeley's English translation omits
    # that front matter entirely, and leaving it in the French source gave
    # the aligner a run of French-only sentences with nothing to pair
    # against right at the start, which it doesn't handle as clean
    # insertions; it just glued them onto neighboring real sentences instead
    # (visible as "DE BALZAC Il se trouve..." — the dedication's signature
    # line fused onto the real opening sentence). Trimming both sides down
    # to the same real content (starting "Il se trouve dans certaines
    # provinces...") fixes it. Le Père Goriot has this identical defect in
    # its shipped PDF/EPUB (same single-block path, same front-matter
    # mismatch) — not fixed here since it's out of this change's scope, but
    # worth the same trim.
    src_path: "input/eugenie_grandet_fr.txt"
    tgt_gutenberg_id: 1715    # Katharine Prescott Wormeley translation (public domain)
    mode: prose
    aligner: auto
    # Wormeley's English translation splits into a short front-matter
    # division plus 14 numbered chapters (I-XIV); tgt_range excludes the
    # front matter. src (now pre-trimmed to just the novel) aligns as a
    # single block against the 14 chapters, same handling as Goriot (run
    # --outline to re-check after a Gutenberg text update).
    tgt_range: 2-15
    first: src
    trim: [6.0, 9.0]
    translation_pd_confirmed: true
    translation_source_note: "Katharine Prescott Wormeley — public domain."
    font: OldStandard
    decorations:
      margin: corners
      chapter: victorian
      color: "#7a5c1e"          # antique gold, fits the miser's hoarded louis d'or
      opener_font: uncialantiqua
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      translator: "Katharine Prescott Wormeley"
    cover:
      paper: white
      blurb: "Balzac's tale of miserliness and thwarted love in provincial Saumur, with the original French and Katharine Prescott Wormeley's classic English translation on facing lines."
    epub: true

  - title: "Buch der Lieder"
    author: "Heinrich Heine"
    src_lang: de
    tgt_lang: en
    src_gutenberg_id: 3498     # Buch der Lieder, German (227 poems)
    tgt_gutenberg_id: 31726    # Emma Lazarus, "Poems and Ballads of Heinrich Heine", 1887 (public domain)
    mode: verse
    aligner: auto
    # Division 1 is front matter on both sides; on the English side the last
    # division is an unrelated Goethe biographical excerpt bundled into this
    # Gutenberg edition. 2-226 / 2-126 excludes both, leaving 225 German poems
    # against Lazarus's 125 (she translated a selection, not the complete
    # collection). Counts don't match, so this pairs by meaning at the
    # division (poem) level rather than 1:1 position — see
    # pipeline._fuzzy_match_divisions. The ~100 poems with no surviving
    # Lazarus translation print in German only; noted in the copyright page.
    src_range: 2-226
    tgt_range: 2-126
    first: src
    trim: [6.0, 9.0]
    translation_pd_confirmed: true
    translation_source_note: "Emma Lazarus, 1887 — public domain. A selection, not the complete collection: ~125 of the 227 poems have a surviving Lazarus translation."
    font: OldStandard
    decorations:
      margin: corners
      chapter: nouveau          # flowing, lyrical — fits a "Book of Songs"
      color: "#5c3a5e"          # dusty plum, Romantic-era mood
      opener_font: uncialantiqua
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      translator: "Emma Lazarus"
      rights: >-
        This edition's typography, arrangement, and design are copyright
        &copy; 2026 Joey Houser. The original German poems by Heinrich Heine
        (1797&ndash;1856) are in the public domain. The English translations
        by Emma Lazarus (1887) are in the public domain. Emma Lazarus
        translated a selection, not Heine's complete <i>Buch der Lieder</i>:
        of its 227 poems, about 125 have a surviving Lazarus translation and
        appear here with facing English text; the rest appear in German only.
    cover:
      paper: white
      blurb: "Heinrich Heine's Book of Songs — the complete German text, with Emma Lazarus's classic English translations facing the poems she rendered."
    epub: true
    # "Musical literature": for the 16 poems Schumann set as Dichterliebe,
    # Op. 48 (matched by first line — see book_creator/music.py), typeset the
    # piano grand staff (treble + bass) under the poem, sourced from the
    # OpenScore Lieder Corpus (CC0). Needs LilyPond (lilypond.org/download,
    # both `lilypond` and `musicxml2ly` on PATH); the build still succeeds
    # without music, with a warning, if it's not installed.
    music:
      enabled: true
      catalog: dichterliebe

  - title: "Les Fleurs du Mal"
    author: "Charles Baudelaire"
    src_lang: fr
    tgt_lang: en
    src_gutenberg_id: 6099     # Les Fleurs du Mal, French
    tgt_gutenberg_id: 36098    # Cyril Scott, "The Flowers of Evil", 1909 (public domain)
    mode: verse
    aligner: auto
    # Unlike Buch der Lieder's single continuous I..CCXXVII numbering, this
    # edition only numbers multi-part poem cycles (restarting at I each
    # time) and otherwise gives standalone poems just a title line with no
    # numeral — so poem_titles is needed to catch those as division
    # boundaries too (see segment._is_isolated_title; added specifically for
    # this book). Division 1 is front matter on both sides; division 2 is a
    # prefatory essay (French) / table of contents (English) with no
    # counterpart, excluded. 3-125 is 123 French poems; 3-57 is 55 English
    # poems — Scott translated a selection, not the complete collection, so
    # this pairs by meaning at the division (poem) level rather than 1:1
    # position, same as Buch der Lieder (run --outline --mode verse
    # --poem-titles to re-check after a Gutenberg text update).
    poem_titles: true
    src_range: 3-125
    tgt_range: 3-57
    first: src
    trim: [6.0, 9.0]
    translation_pd_confirmed: true
    translation_source_note: "Cyril Scott, 1909 — public domain. A selection, not the complete collection: 55 of this edition's 123 poems have a surviving Scott translation."
    font: OldStandard
    decorations:
      margin: corners
      chapter: baroque          # ornate and dark, fits the collection's decadence
      color: "#4a1942"          # decadent violet-black
      opener_font: uncialantiqua
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      translator: "Cyril Scott"
      rights: >-
        This edition's typography, arrangement, and design are copyright
        &copy; 2026 Joey Houser. The original French poems by Charles
        Baudelaire (1821&ndash;1867) are in the public domain. The English
        translations by Cyril Scott (1909) are in the public domain. Scott
        translated a selection, not Baudelaire's complete <i>Les Fleurs du
        Mal</i>: of this edition's 123 poems, 55 have a surviving Scott
        translation and appear here with facing English text; the rest
        appear in French only.
    cover:
      paper: white
      blurb: "Charles Baudelaire's landmark collection of French Symbolist poetry — the complete French text, with Cyril Scott's 1909 English verse translations facing the poems he rendered."
    epub: true

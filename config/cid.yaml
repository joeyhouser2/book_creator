# Cantar de Mio Cid: Old Spanish with Rose's English, laisse by laisse.
#
# python fetch_cid.py writes both files. The Spanish is Menendez Pidal's
# critical text (1911) from machine-read OCR; its laisses are not numbered, so
# they are cut by measuring assonance and number 158 where Rose has 149 -- the
# pairing is by meaning, not by position. The English is Rose's 1919
# translation (Gutenberg #6088).
#
# Run with:  python make_book.py config/cid.yaml

books:
  - title: "Cantar de Mio Cid"
    author: "Anonymous"
    src_lang: es
    tgt_lang: en
    src_path: "input/cid_es.txt"
    tgt_path: "input/cid_en.txt"
    mode: verse
    verse_align: stanza
    first: src
    trim: [6.0, 9.0]
    translation_pd_confirmed: true
    translation_source_note: "Rose, 1919 — public domain."
    font: OldStandard
    decorations:
      margin: corners
      chapter: medieval
      color: "#7a2e1b"
      opener_font: uncialantiqua
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      translator: "Rose"
      rights: >-
        This edition's typography, arrangement, and design are copyright
        &copy; 2026 Joey Houser. The Old Spanish text of the <i>Cantar de Mio
        Cid</i> is anonymous and in the public domain; it is set from Ram&oacute;n
        Men&eacute;ndez Pidal's 1911 critical edition from machine-read text
        that has not been proofread, with the editor's notes removed and its
        laisses divided by assonance. The English translation (Rose, 1919) is
        in the public domain.
    cover:
      paper: white
      blurb: "The Poem of the Cid, Spain's national epic of the exiled Castilian knight, in the Old Spanish of Menéndez Pidal's text with a facing English translation."
    epub: true

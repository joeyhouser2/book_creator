# Each entry produces one PDF in output/.
#
# Find Gutenberg ids in the URL of a book's page, e.g.
#   https://www.gutenberg.org/ebooks/228   ->  id 228
#
# IMPORTANT: translation_pd_confirmed must be true to suppress the copyright
# warning. Only set it true once you have verified the TRANSLATION (not just the
# original) is public domain — in the US that generally means first published
# before 1929. The originals below are ancient/public-domain; the *translations*
# must be checked individually.

books:
  - title: "The Gallic War"
    author: "Julius Caesar"
    src_lang: la          # Latin original
    tgt_lang: en
    src_gutenberg_id: 218     # De Bello Gallico, Latin (Books I-IV)
    tgt_gutenberg_id: 10657   # McDevitte & Bohn translation, 1869 (public domain)
    mode: prose
    aligner: auto         # auto | embed (LaBSE, meaning-based) | gale-church (length)
    # Scope BOTH sides to the same content. #218 is Gallic War I-IV (divisions
    # 2-5); #10657's Gallic War is also divisions 2-5 (run `--outline` to list
    # them). Without this the texts mismatch (#10657 also has the Civil War).
    src_range: 2-5
    tgt_range: 2-5
    first: src            # Latin line first, then English
    trim: [6.0, 9.0]
    translation_pd_confirmed: true
    translation_source_note: "W. A. McDevitte & W. S. Bohn, 1869 — public domain."
    font: Cardo           # shorthand: family name. Or a full block (see below).
    decorations:
      margin: corners     # none | rule | corners | frame
      chapter: fleuron    # none | fleuron | rule
      color: "#8a7a5c"    # ornament ink color
    copyright:            # the copyright page (set `copyright: false` to omit)
      publisher: "Houser Classics"
      holder: "Joey Houser"        # holds the *compilation* copyright only
      year: 2026
      isbn: ""                     # KDP can assign a free ISBN
      translator: "W. A. McDevitte and W. S. Bohn"
      # rights: "..."              # optional: replace the generated text entirely
    cover:                # wraparound cover -> output/<slug>-cover.pdf
      paper: white        # white | cream | color (sets spine width)
      blurb: "Caesar's account of the conquest of Gaul, with the original Latin and a classic English translation on facing lines."

  - title: "Meditations"
    author: "Marcus Aurelius"
    src_lang: grc         # Greek original (use grc for Greek terminators ; and ·)
    tgt_lang: en
    src_path: "input/meditations_grc.txt"   # or a Gutenberg id
    tgt_gutenberg_id: 2680                   # Long's translation (1862, public domain)
    mode: prose
    aligner: embed         # force the meaning-based aligner for this one
    first: tgt             # English first, Greek second
    translation_pd_confirmed: true
    translation_source_note: "George Long translation, 1862 — public domain."
    font:                  # full font block with explicit files
      family: GentiumPlus
      regular: GentiumPlus-Regular.ttf
      italic: GentiumPlus-Italic.ttf
      bold: GentiumPlus-Bold.ttf
    decorations:
      margin: frame
      chapter: fleuron
      # corner_image: art/corner.png    # optional: your own PNG, mirrored into corners

  # ------------------------------------------------------------------------
  # A work pulled from the `latin` repo's corpus instead of two Gutenberg
  # editions. That corpus stores one Latin (or Greek) sentence per row with its
  # English beside it, so there is nothing to fetch, segment, or align — and no
  # alignment drift to proofread for. Browse ids with:
  #     python make_book.py --corpus --corpus-search alcuinus
  #     python make_book.py --corpus --corpus-id 79      # sections + licence
  #
  # title/author/src_lang are optional here: they are filled in from the
  # document record. `corpus: 79` on its own is the whole minimum entry.
  #
  # NOTE the copyright situation is the reverse of the Gutenberg case. The
  # English is machine translation this project produced, so no translator
  # holds copyright on it (a disclosure to that effect goes on the copyright
  # page automatically). What you must check instead is the *source* licence,
  # which the corpus records honestly and which is often not free — the CLI and
  # the web UI both flag it.
  - corpus:
      doc_id: 79
      section_range: 2-3      # optional; omit for the whole work
      prefer_styled: true     # use the Victorian-stylized English where it exists
      strip_markup: true      # print "Altus", not "<A>ltus" (default)
      # db_path: "../latin"   # defaults to $LATIN_REPO, then ../latin
    mode: verse
    font: Cardo
    epub: true
    # sides: both | src | tgt. Default `both` is the parallel text; `src` prints
    # a monolingual edition of the original (and needs no public-domain
    # confirmation, since no translation is published — it also unlocks the
    # corpus's untranslated works); `tgt` prints the English alone.
    # sides: src
    # Narrate an interleaved bilingual audiobook on the GPU. Each bead is read
    # original-then-translation, mirroring the printed parallel text. Needs
    # requirements-audio.txt — see the warning at the top of that file about
    # installing it in its own virtualenv.
    audio:
      enabled: true
      engine: chatterbox    # chatterbox (MIT) | kokoro (Apache-2.0) | xtts (non-commercial)
      device: cuda:1        # omit to pick the CUDA device with the MOST memory
      voice: "input/narrator.wav"   # 6-30s reference clip; one narrator, both languages
      format: m4b           # m4b (chapter markers) | mp3
      # max_beads: 20       # test run: narrate only the first N beads
      # pause_within: 0.45  # gap between the two languages of one bead
      # pause_bead: 0.9     # gap between beads

  # "Musical literature" (verse-mode books only): for poems that were set to
  # music, typeset the piano grand staff (treble + bass) under the poem,
  # matched by first line against a registered catalog. Currently only
  # catalog: dichterliebe (Schumann's Dichterliebe, Op. 48 — 16 Heine poems)
  # is built in; see book_creator/music.py to add more. Source: the OpenScore
  # Lieder Corpus (CC0). Needs LilyPond (lilypond.org/download, both
  # `lilypond` and `musicxml2ly` on PATH) — the build still succeeds without
  # music, with a warning, if it's not installed.
  # music:
  #   enabled: true
  #   catalog: dichterliebe

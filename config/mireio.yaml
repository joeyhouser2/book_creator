# Mistral, Mireio (1859), 12 cantos: Provencal with Harriet Waters Preston's 1872 English.
#
# python fetch_mireio.py writes both files. The Provencal is the left-hand
# pages of the 1861 Avignon bilingual edition (Mistral's own facing French is
# left out); the English is Gutenberg #56008. Preston writes six-line stanzas
# to Mistral's seven, so stanza counts differ per canto and the pairing is by
# meaning, not by position.
#
# Run with:  python make_book.py config/mireio.yaml

books:
  - title: "Mirèio"
    author: "Frédéric Mistral"
    src_lang: oc
    tgt_lang: en
    src_path: "input/mireio_oc.txt"
    tgt_path: "input/mireio_en.txt"
    src_range: 1-12
    mode: verse
    verse_align: stanza
    first: src
    trim: [6.0, 9.0]
    translation_pd_confirmed: true
    translation_source_note: "Harriet Waters Preston, 1872 — public domain."
    font: Cardo
    decorations:
      margin: corners
      chapter: rococo
      color: "#8a5a00"
      opener_font: uncialantiqua
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      translator: "Harriet Waters Preston"
      rights: >-
        This edition's typography, arrangement, and design are copyright
        &copy; 2026 Joey Houser. The Provençal text of Frédéric Mistral
        (1830&ndash;1914) is in the public domain; it is set from the 1861
        Avignon bilingual edition from machine-read text that has not been
        proofread. The English translation by Harriet Waters Preston (1872)
        is in the public domain.
    cover:
      paper: white
      blurb: "Frédéric Mistral's Nobel-winning Provençal epic of Mireille and Vincent, in twelve cantos, with Harriet Waters Preston's 1872 English verse translation."
    epub: true

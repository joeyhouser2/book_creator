# Ercilla, La Araucana, Part One (cantos 1-15, 1569): Spanish with a machine English.
#
# No public-domain English exists (Lancaster and Manchester's 1945 translation
# is in copyright), so the English is generated by a local chat model and
# disclosed as such. It is translated octava by octava -- the stanza is the unit
# that holds a sentence -- and printed as the eight lines of Spanish followed by
# the English of the whole stanza. python fetch_araucana.py writes the input.
# Parts Two and Three (cantos 16-37) are in other volumes of the same edition.
#
# Run with:  python make_book.py config/araucana.yaml

translators:
  es:
    ollama: "qwen3:14b"
    batch: 6
    context: >-
      This is Alonso de Ercilla's La Araucana (1569), a 16th-century Spanish epic
      in ottava rima about the Spanish conquest of Chile and the Araucanian
      (Mapuche) war; names such as Arauco, Caupolicán, Lautaro, Valdivia and
      Tucapel are people and places.

books:
  - title: "La Araucana, Part One"
    author: "Alonso de Ercilla"
    src_lang: es
    tgt_lang: en
    src_path: "input/araucana_es.txt"
    mode: verse
    translate: true
    translate_by: stanza
    first: src
    trim: [6.0, 9.0]
    font: OldStandard
    decorations:
      margin: corners
      chapter: baroque
      color: "#2f4a2a"
      opener_font: uncialantiqua
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      rights: >-
        This edition's typography, arrangement, and design are copyright
        &copy; 2026 Joey Houser. The Spanish text of Alonso de Ercilla
        (1533&ndash;1594) is in the public domain; it is set from the 1911
        edition in modern orthography, from machine-read text that has not
        been proofread. Part One only: cantos 1&ndash;15 of 37. The English is
        a machine translation made for this edition, not a published human
        translation, and will contain errors.
    cover:
      paper: white
      blurb: "Ercilla's epic of the Araucanian war in Chile, the first part, in the original Spanish with a machine-made English translation."
    epub: true

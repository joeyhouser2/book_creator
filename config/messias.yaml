# Klopstock, Der Messias: German with G. H. C. Egestorff's English verse, one volume.
#
# The German is zeno.org's text of the 1879 Berlin edition (fetch_sources.py
# messias): 19,479 lines in 20 cantos. Egestorff's English is the 1826 blank-verse
# translation, complete, read from the page scans of the archive.org copies
# klopstocksmessi00klopgoog and klopstocksmessi01klopgoog by Tesseract
# (fetch_egestorff.py). It replaces a machine translation made a line at a time,
# which dropped one sentence of every German line that held two.
#
# Egestorff runs about 1.5 English lines to each German line, so there is no line
# for line pairing: blocks of six German lines are aligned by meaning (LaBSE)
# against the English that carries them, and each pair is set German then English.
#
# Two volumes' worth of text in one: 8.5 x 11 in. with "tight" line spacing is what
# brings it under KDP's 828-page limit.
#
# python fetch_egestorff.py, then:  python make_book.py config/messias.yaml

# The English has three holes where the scan lost pages (Cantos II, XIV, XIX; see
# fetch_egestorff.py). The German there is machine translated by qwen3:14b,
# printed with a dagger, and disclosed on the copyright page (fill_missing).
translators:
  de:
    ollama: "qwen3:14b"
    batch: 6
    context: >-
      This is Klopstock's Der Messias (1748-73), a hexameter epic of the
      Passion, Resurrection and Ascension, in 18th-century German verse. Names
      (keep them as given, never swap one for another): Messias and Jesus
      Christus; Kephas and Simon (Peter); Johannes (John); Jakobus (James);
      Lebbäus (Thaddaeus); Bartholomäus; Didymus (Thomas); Magdale or Magdalena
      (Mary Magdalene); Maria; Lazarus; Abbadona, Abdiel, Adramelech and Satan
      (fallen angels); Gabriel and Eloa (angels); Jehovah is God the Father,
      "der Ewige". "grauend" is greying. Render the sense in plain, literal
      English prose, with pronouns in lower case.

books:
  - title: "Der Messias"
    author: "Friedrich Gottlieb Klopstock"
    src_lang: de
    tgt_lang: en
    src_path: "input/messias_de.txt"
    tgt_path: "input/messias_en_egestorff.txt"
    mode: verse
    verse_align: line
    aligner: embed
    align_block: 6
    # Egestorff's English runs about 1.5 lines to a German line and a block cut by
    # count lands a few lines off; re-cut it line by line from a translation
    # model's evidence (book_creator/align_lines.py; GPU once, then cached).
    recut: true
    fill_missing: true
    # Where the English has no counterpart: the last original line the English
    # before each hole covers, and the first it picks up again. Read against the
    # page images (pages 52-53, 645 and 648 are not in the scan; one page of XIV is
    # illegible). The English side is cut at its [about N lines lost] marker.
    translation_gaps:
      - after_src: "Oder ihr Ende, der Ungeheuren, mit anzusehen."
        resume_src: "Finstrer Gedanke, Gedanke voll Qual! und Du, wilde Verzweiflung!"
      - after_src: "Die voll Erwartungen war und Zweifel und Freud' und Erstaunen."
        resume_src: "Eher nicht in die Grube sich neigen, als auch mein Auge"
      # Canto XIX loses two single pages: 645 (lines 1191-1235) and 648
      # (1326-1370). Page 644 is in the scan but bound after 647; the text is
      # put back in order by fetch_egestorff.py.
      - after_src: "Von den Mördern umringt, die Hand in der Fessel, erblickten?"
        resume_src: "Siehe, Du hast ihn gezeigt und bist verherrlichet worden,"
      - after_src: "Sinkend jetzt fortfährt mit Schönheit, nun, steigender immer,"
        resume_src: "Aber, so licht der Schein auch war, der des Glücklichen Tiefsinn"
    first: src
    trim: [8.5, 11.0]
    density: tight
    translation_pd_confirmed: true
    translation_source_note: "G. H. C. Egestorff, 1826 — public domain."
    font: Cardo
    decorations:
      margin: none
      chapter: fleuron
      color: "#3b3a52"
    copyright:
      publisher: "Houser Classics"
      holder: "Joey Houser"
      year: 2026
      isbn: ""
      translator: "G. H. C. Egestorff"
      rights: >-
        This edition's typography, arrangement, and design are copyright
        &copy; 2026 Joey Houser. The German text of Klopstock's <i>Der
        Messias</i> is in the public domain; it is set from zeno.org's transcription
        of the Berlin edition of 1879. The English verse translation by G. H. C.
        Egestorff (1826) is in the public domain; it is set from machine-read
        scans of the first edition, in which a language model has repaired words
        the scan misread and which have not been proofread, and Egestorff
        does not follow Klopstock line for line, so the English is placed beside
        the German it renders by meaning, in blocks of about six lines. Four
        places in the scan have lost text, and each is marked where it falls:
        about 34 lines in Canto XIV, where a page is illegible; about 90 lines
        in Canto II, where two pages are missing from the scan altogether; and
        about 45 lines each at two places in Canto XIX, where a page is missing
        (one further page of that canto is bound out of order in the scan, and
        has been put back). The German there has no English beside it, and those
        passages are marked &dagger; and were machine translated for this
        edition.
    cover:
      paper: white
      blurb: "Klopstock's twenty-canto epic of the Passion, the German Paradise Lost whose hexameters remade German as a poetic language, with G. H. C. Egestorff's 1826 English verse translation set beside it, complete in one volume."
    epub: true

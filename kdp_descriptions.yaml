# KDP product descriptions, one per book in CATALOGUE.md, keyed by output slug.
#
# make_catalogue.py reads this and writes KDP.md: each description as the HTML
# KDP's description box accepts (<p>, <i>, <b> only), with its length against
# KDP's 4,000-character limit, and a list of any catalogued book without one.
#
# Paragraphs are separated by a blank line. Two paragraphs are added by the
# script rather than written out here, so they cannot drift between books:
#   - every machine-translated book gets the same disclosure paragraph, and
#   - every Rhodoman book gets the same paragraph about him and the series.
# `hold:` marks a book that should not be listed yet, with the reason; KDP.md
# prints the reason in place of the description.

# ---------------------------------------------------------------- human English

parzival: |
  Wolfram von Eschenbach's <i>Parzival</i> is the greatest Arthurian romance of the German Middle Ages and the fullest telling of the Grail story in any language of its time. A boy raised in the forest by a mother determined to keep him from knighthood rides out in fool's clothing, blunders into the Grail castle, fails to ask the one question that would heal its wounded king, and spends years earning the right to return. Alongside him rides Gawan, whose adventures among enchanted castles and difficult ladies make a worldly counterpart to Parzival's spiritual quest.

  This edition prints the complete Middle High German text, all sixteen books, with Jessie L. Weston's 1894 English translation, each book given first in the original and then in English. Weston, whose <i>From Ritual to Romance</i> later shaped Eliot's <i>The Waste Land</i>, was the first to put the whole poem into English.

notre-dame-de-paris: |
  Victor Hugo wrote <i>Notre-Dame de Paris</i> to save a building. In 1831 the great Gothic cathedrals of France were being neglected, defaced and pulled down, and Hugo's novel of fifteenth-century Paris made the cathedral itself its central character: the stone world in which the bell-ringer Quasimodo, the dancer Esmeralda and the archdeacon Claude Frollo are bound together by love, obsession and cruelty.

  This parallel edition prints Hugo's French with Isabel F. Hapgood's 1888 English translation, paragraph by paragraph, so the reader of either language can move between them without losing the place. It is a companion for students of French, for readers returning to Hugo in the original, and for anyone who wants to see what a translation keeps and what it cannot.

le-rouge-et-le-noir: |
  Julien Sorel, a carpenter's son from the Franche-Comté with a head full of Napoleon, sets out to rise in the France of the Restoration, where the army (the red) is closed to men like him and the Church (the black) is not. He becomes tutor in a provincial mayor's household, seminarian, and secretary to a Parisian marquis, advancing by calculation and undone by the sincerity of his passions. Stendhal's 1830 "chronicle" is one of the founding works of the modern psychological novel.

  This parallel edition prints Stendhal's French with Horace B. Samuel's 1916 English translation, paragraph by paragraph, for students of French and for readers who want the original within reach.

der-messias: |
  Klopstock's <i>Der Messias</i> is the German <i>Paradise Lost</i>: an epic of the Passion and Resurrection in twenty cantos, begun when its author was a student in 1748 and finished a quarter of a century later. Its first cantos electrified Germany; Goethe recalled households divided over it. Written in hexameters at a time when German verse was thought incapable of them, it remade the language as a medium for high poetry and opened the way for everything from Goethe and Schiller onward.

  This edition prints the complete German text, all twenty cantos in one volume, with G. H. C. Egestorff's complete English hexameter translation of 1826, set line by line beside the original.

le-p-re-goriot: |
  In a shabby boarding house in the Latin Quarter, a retired vermicelli merchant gives away everything he has to two daughters married into society, who will not be seen with him. Watching him are a law student from the provinces, Eugène de Rastignac, learning what Paris costs, and the mysterious Vautrin, who offers to teach him faster. <i>Le Père Goriot</i> (1835) is the novel in which Balzac first brought characters back from book to book, and so the cornerstone of <i>La Comédie humaine</i>.

  This parallel edition prints Balzac's French with Ellen Marriage's 1896 English translation, paragraph by paragraph.

das-nibelungenlied: |
  The <i>Nibelungenlied</i> is the national epic of medieval Germany: Siegfried, the dragon-slayer, wins Kriemhild of Burgundy and is murdered by Hagen at her brothers' court; Kriemhild, years later married to Etzel, king of the Huns, invites her kin to his hall and takes a revenge that destroys them all. Composed around 1200 by an unknown poet on the Danube, it is the source behind Wagner's <i>Ring</i> and one of the darkest and most powerful poems of the Middle Ages.

  This edition sets Karl Simrock's celebrated modern German rendering beside George Henry Needler's 1904 English verse translation, which keeps the four-line Nibelungen strophe, strophe for strophe. For the poem in its own Middle High German, see the companion edition.

das-nibelungenlied-mhg: |
  The <i>Nibelungenlied</i> is the national epic of medieval Germany: Siegfried, the dragon-slayer, wins Kriemhild of Burgundy and is murdered by Hagen at her brothers' court; Kriemhild, years later married to Etzel, king of the Huns, invites her kin to his hall and takes a revenge that destroys them all. Composed around 1200 by an unknown poet on the Danube, it is the source behind Wagner's <i>Ring</i> and one of the darkest and most powerful poems of the Middle Ages.

  This edition prints the poem in its own language, the Middle High German of Karl Simrock's 1892 edition, with George Henry Needler's 1904 English verse translation facing it strophe by strophe, all thirty-nine âventiuren. Needler keeps the long four-line Nibelungen strophe with its mid-line pause, so the English moves to the same rhythm as the German beside it.

das-nibelungenlied-en: |
  The <i>Nibelungenlied</i> is the national epic of medieval Germany: Siegfried, the dragon-slayer, wins Kriemhild of Burgundy and is murdered by Hagen at her brothers' court; Kriemhild, years later married to Etzel, king of the Huns, invites her kin to his hall and takes a revenge that destroys them all. Composed around 1200 by an unknown poet on the Danube, it is the source behind Wagner's <i>Ring</i>.

  This is George Henry Needler's complete 1904 English verse translation on its own, all thirty-nine adventures, in the poem's four-line strophe. Readers who want the German alongside will find it in the parallel edition.

anabasis: |
  In 401 BC ten thousand Greek mercenaries marched into the heart of the Persian empire for Cyrus the Younger, who meant to take his brother's throne. Cyrus fell in his first battle; the Greek generals were seized and executed under truce; and the army, leaderless in hostile country, elected new officers and fought its way north through mountains, snow and hostile tribes until, from a summit near Trebizond, the vanguard saw the sea and shouted "Thálatta! thálatta!" Xenophon, an Athenian who joined as a volunteer and became one of its leaders, tells the story himself.

  This parallel edition prints the Greek with the 1921–22 Loeb translation by Carleton L. Brownson, passage by passage, for students of Greek and for readers of the most famous retreat in history.

kudrun: |
  <i>Kudrun</i> is the other great heroic epic of medieval Germany, written a generation after the <i>Nibelungenlied</i> and in conscious answer to it. Kudrun, a Hegelingen princess, is carried off by Hartmut of Normandy on the eve of her wedding; for thirteen years she refuses him and is set to wash clothes on the shore by his mother, until her people's fleet at last arrives. Where Kriemhild avenges, Kudrun endures, and in the end reconciles.

  This edition prints the Middle High German of Karl Bartsch's text with Arthur Nichols' 1889 English verse translation, strophe for strophe. The German was read from a scan by machine; strophes lost in the reading are marked as such beside their English rather than silently dropped.

os-lusiadas: |
  <i>Os Lusíadas</i> is the epic of Portugal: Vasco da Gama's voyage round Africa to India in 1497–98, told in ten cantos of ottava rima in which the gods of Olympus take sides, Venus for the Portuguese and Bacchus against them, and the whole history of the nation unfolds along the way. Camões sailed the same route himself, lost an eye fighting in Morocco, and is said to have swum ashore from a shipwreck in the Mekong holding his manuscript above the water.

  This parallel edition prints the Portuguese with Richard Francis Burton's 1880 English verse translation, stanza by stanza. Burton, explorer and translator of the <i>Arabian Nights</i>, called Camões his master.

os-lusiadas-en: |
  <i>Os Lusíadas</i> is the epic of Portugal: Vasco da Gama's voyage round Africa to India in 1497–98, told in ten cantos in which the gods of Olympus take sides and the history of the nation unfolds along the way. Camões sailed the same route himself.

  This is Richard Francis Burton's 1880 English verse translation on its own, in ottava rima like the original. Burton, explorer and translator of the <i>Arabian Nights</i>, called Camões his master. A parallel Portuguese–English edition is also available.

eug-nie-grandet: |
  In provincial Saumur, the cooper-turned-millionaire Félix Grandet counts every lump of sugar in a house he keeps cold and dark. His daughter Eugénie has never wanted anything until her Parisian cousin Charles arrives, ruined, and she gives him her gold. Balzac's 1833 novel is a study of avarice and of a woman's patient, lifelong fidelity, and one of the most perfectly made books in <i>La Comédie humaine</i>.

  This parallel edition prints Balzac's French with Katharine Prescott Wormeley's English translation, paragraph by paragraph.

buch-der-lieder: |
  Heinrich Heine's <i>Buch der Lieder</i> (1827) became the most widely read and most often set book of poems in German. Schumann's <i>Dichterliebe</i>, Schubert's late songs and hundreds of other settings come from it; "Die Lorelei" and "Du bist wie eine Blume" passed into folk memory. Its lyrics of love and disillusion, sweet and then suddenly ironic, made Heine famous across Europe.

  This edition prints the complete German text with the translations of Emma Lazarus (1887), the American poet of "The New Colossus", facing the poems she rendered, roughly 125 of the 227. The rest stand in German alone.

gerusalemme-liberata-volume-1: |
  Torquato Tasso's <i>Gerusalemme Liberata</i> (1581) is the great epic of the First Crusade: Godfrey of Bouillon's siege of Jerusalem, and the loves and enchantments that keep his knights from it. It was the most read poem in Europe for two centuries, and the source of operas by Monteverdi, Lully, Handel, Gluck and Rossini.

  This first volume contains cantos 1–10 in Tasso's Italian with Edward Fairfax's English translation of 1600, stanza by stanza: an Elizabethan masterpiece in its own right, admired by Dryden and Waller, in the same ottava rima as the original. Volume 2 completes the poem.

gerusalemme-liberata-volume-2: |
  The second half of Tasso's epic of the First Crusade: cantos 11–20, with Armida's enchanted garden, Rinaldo's return, the death of Clorinda at the hands of Tancred who loves her, and the final assault on Jerusalem.

  Tasso's Italian with Edward Fairfax's 1600 English translation in ottava rima, stanza by stanza, completing the two-volume parallel edition begun in Volume 1.

gerusalemme-liberata-en: |
  Torquato Tasso's <i>Gerusalemme Liberata</i> (1581), the great epic of the First Crusade, was the most read poem in Europe for two centuries and the source of operas by Monteverdi, Handel, Gluck and Rossini.

  This is Edward Fairfax's complete English translation of 1600, all twenty cantos in one volume, in the ottava rima of the original. Dryden ranked Fairfax with Spenser as a master of English verse. A two-volume Italian–English parallel edition is also available.

mireio: |
  <i>Mirèio</i> (1859) is the poem that brought Provençal back into literature. Mirèio, daughter of a rich farmer in the Crau, loves Vincèn, a poor basket-maker; refused by her father, she crosses the burning plain on foot to pray at Saintes-Maries-de-la-Mer, and dies there of sunstroke. Lamartine hailed it on publication; Gounod made it an opera; and in 1904 Frédéric Mistral received the Nobel Prize for literature.

  This edition prints Mistral's Provençal, all twelve cantos, with Harriet Waters Preston's 1872 English verse translation, stanza by stanza.

les-fleurs-du-mal: |
  <i>Les Fleurs du mal</i> (1857) is the book from which modern poetry descends. Baudelaire was prosecuted for offending public morals the year it appeared, and six poems were banned; the rest, on the city, on erotic love and on spleen and boredom, opened the way for Verlaine, Rimbaud, Mallarmé and the Symbolists.

  This edition prints Baudelaire's French with the 1909 English verse translations of the composer Cyril Scott facing the 55 poems he translated.

anglorum-praelia: |
  Christopher Ocland's <i>Anglorum Praelia</i> (1580) sings England's battles from Crécy and Poitiers under Edward III to the reign of Mary in Latin hexameters, and with its sequel in praise of Elizabeth was ordered by the Privy Council in 1582 to be read in the grammar schools of the realm.

  This edition prints Ocland's Latin with John Sharrock's English verse translation of 1585, line by line: a Tudor schoolroom set text and a document of Elizabethan national feeling.

cantar-de-mio-cid: |
  The <i>Cantar de mio Cid</i> is the national epic of Spain and the only one of its kind to survive almost complete. Rodrigo Díaz, the Cid, banished by Alfonso VI, leaves Burgos with a handful of men, wins Valencia from the Moors, recovers his king's favour, and avenges the outrage done to his daughters by the Infantes of Carrión, all told with a sobriety and realism rare in medieval epic.

  This edition prints the Old Spanish of Ramón Menéndez Pidal's text with the 1919 English verse translation of R. Selden Rose and Leonard Bacon, laisse by laisse.

life-of-the-black-prince: |
  Edward of Woodstock, the Black Prince, was the most famous knight of the fourteenth century: victor of Crécy at sixteen and of Poitiers, where he captured the King of France, and of Nájera in Spain. This verse life was written about 1385 by the herald of Sir John Chandos, the Prince's companion in arms, who saw much of what he describes.

  This edition prints the Anglo-Norman poem as transcribed from the manuscript by Mildred K. Pope and Eleanor C. Lodge with their English translation (Oxford, 1910), passage by passage.

de-consulatu-stilichonis: |
  Claudian, the last great poet of pagan Rome, was court poet to Stilicho, the half-Vandal general who held the Western Empire together around AD 400. <i>On the Consulship of Stilicho</i> celebrates his consulship of 400 in three books: his wars, his virtues, and the arrival of the new consul in Rome.

  This edition prints Claudian's Latin with Maurice Platnauer's 1922 Loeb translation.

in-eutropium: |
  Eutropius, a eunuch and former slave, rose to be the most powerful man at the eastern court and in 399 the first eunuch ever named consul. Claudian, writing for Stilicho in the West, answered with two books of invective: Roman political abuse at its most savage and most brilliant.

  This edition prints Claudian's Latin with Maurice Platnauer's 1922 Loeb translation.

in-rufinum: |
  Rufinus, praetorian prefect of the East and Stilicho's rival, was murdered by soldiers in 395. Claudian's two books against him open with the Furies plotting to send a monster into the world, and end with his descent to judgement: invective raised to epic.

  This edition prints Claudian's Latin with Maurice Platnauer's 1922 Loeb translation.

de-bello-gothico: |
  In 402 Stilicho met Alaric's Goths at Pollentia in northern Italy and drove them back. Claudian's <i>Gothic War</i>, written within months, celebrates the victory and the relief of Rome, eight years before Alaric would take the city.

  This edition prints Claudian's Latin with Maurice Platnauer's 1922 Loeb translation.

de-bello-gildonico: |
  In 397 Gildo, commander in Africa, cut off the grain supply on which Rome lived. Claudian's <i>War against Gildo</i> tells of the city's appeal to the gods and the expedition that ended the revolt.

  This edition prints Claudian's Latin with Maurice Platnauer's 1922 Loeb translation.

the-gallic-war: |
  Book I of Caesar's <i>Commentaries on the Gallic War</i>: the migration of the Helvetii, Caesar's pursuit and victory at Bibracte, and his campaign against the German king Ariovistus. The plainest and most famous Latin prose of all, and the first Latin many readers ever learn.

  This edition prints Caesar's Latin with the English translation of W. A. McDevitte and W. S. Bohn (1869), passage by passage.

the-battle-of-maldon: |
  In August 991 a viking army camped on an island in the Blackwater estuary. Byrhtnoth, ealdorman of Essex, let them cross to fight on fair ground, and died with his household troops around him. <i>The Battle of Maldon</i> is the Old English poem of that defeat, with its famous lines on courage rising as strength fails.

  This edition prints the Old English with James M. Garnett's line-for-line translation.

ode-to-plato: |
  When Aldus Manutius printed the first edition of Plato's works in Greek in 1513, the Cretan scholar Marcus Musurus prefaced it with an ode in Homeric verse, asking Plato to come down and present his own books to Pope Leo X. It is the finest Greek poem of the Renaissance.

  This edition prints Musurus' Greek with the rhymed English translation by William Roscoe (1805), the historian of Leo X.

the-battle-of-murten: |
  In June 1476 the Swiss Confederates destroyed the army of Charles the Bold, Duke of Burgundy, at Murten. Veit Weber, a minstrel who fought in the ranks, made a song of it in his own Alemannic German, and it survives as one of the finest war songs of the late Middle Ages.

  This edition prints Weber's song with C. C. Felton's 1845 English ballad version from Longfellow's <i>Poets and Poetry of Europe</i>, strophe by strophe.

# ---------------------------------------------------------- machine English

theuerdank: |
  <i>Theuerdank</i> is the autobiography of an emperor disguised as a romance of chivalry. The knight Theuerdank (Maximilian I) rides to win Queen Ehrenreich (Mary of Burgundy), and three captains, Fürwittig, Unfalo and Neidelhart, lead him into peril after peril: avalanches, wild beasts, collapsing towers, poisoned feasts. Most of the dangers really befell Maximilian. Printed in 1517 in a type cut specially for it and illustrated with woodcuts by Leonhard Beck, Hans Burgkmair and Hans Schäufelein, it is one of the great books of early printing.

  This edition prints the poem in the Early New High German of the 1517 text, with its spelling kept, and an English translation made for this edition, sentence by sentence, with the first edition's woodcuts set into the chapters. No English translation has ever been published.

theuerdank-fraktur: |
  <i>Theuerdank</i> is the autobiography of an emperor disguised as a romance of chivalry. The knight Theuerdank (Maximilian I) rides to win Queen Ehrenreich (Mary of Burgundy), and three captains, Fürwittig, Unfalo and Neidelhart, lead him into peril after peril: avalanches, wild beasts, collapsing towers, poisoned feasts. Most of the dangers really befell Maximilian. Printed in 1517 in a type cut specially for it and illustrated with woodcuts by Leonhard Beck, Hans Burgkmair and Hans Schäufelein, it is one of the great books of early printing.

  This edition sets the German in Theuerdank Fraktur, a digital face modelled on the type Maximilian commissioned for the 1517 printing, so the poem appears much as its first readers saw it, with the first edition's woodcuts set into the chapters. Beside it is an English translation made for this edition, sentence by sentence; no English translation has ever been published. An edition with the German in modern roman type is also available.

la-araucana-part-one: |
  <i>La Araucana</i> is the first great poem of the Americas. Alonso de Ercilla, a young courtier, went to Chile in 1557 to fight the Mapuche, and wrote the war in ottava rima "on scraps of leather and letters", as he said, in the field. Its heroes are not the Spaniards but their enemies, Lautaro and Caupolicán, and Cervantes ranked it among the best epics in Spanish.

  This first volume contains cantos 1–15 in Ercilla's Spanish with an English translation made for this edition, stanza by stanza.

la-araucana-parts-two-and-three: |
  The second and third parts of Ercilla's epic of the Araucanian war in Chile, cantos 16–37: the capture and execution of Caupolicán, Ercilla's journeys south to the edge of the known world, and the poet's own growing disillusion with the conquest he served.

  Ercilla's Spanish with an English translation made for this edition, stanza by stanza, completing the edition begun in Part One.

la-franciade: |
  Pierre de Ronsard, prince of poets, set out in 1572 to give France its <i>Aeneid</i>: the story of Francus, a son of Hector secretly saved from the fall of Troy, whose descendants would found the French monarchy. After the Massacre of St Bartholomew and the death of Charles IX he abandoned it at the end of the fourth book.

  This edition prints the four books in Ronsard's French with an English translation made for this edition.

la-henriade: |
  Voltaire's <i>La Henriade</i> (1723/1728) is his bid to give France an epic: Henri of Navarre, besieging Paris during the wars of religion, is shown the future by Saint Louis, converts, and ends the civil war. It was the most admired French poem of the eighteenth century and an argument for religious toleration in verse.

  This edition prints the ten chants in Voltaire's French with an English translation made for this edition, line by line.

la-legende-des-siecles: |
  <i>La Légende des siècles</i> is Victor Hugo's history of humanity told as a sequence of visions, from Eve and Cain through the knights of the Middle Ages to the twentieth century and the end of time. Written in exile on Guernsey, it is the largest poetic undertaking of the French nineteenth century.

  This edition prints a selection of the poems in Hugo's French with an English translation made for this edition.

la-legende-des-siecles-en: |
  <i>La Légende des siècles</i> is Victor Hugo's history of humanity told as a sequence of visions, from Eve and Cain through the knights of the Middle Ages to the end of time, written in exile on Guernsey.

  This is the English of the parallel edition on its own: an English translation made for this edition. The French–English parallel edition is also available.

hesperis: |
  Basinio da Parma's <i>Hesperis</i> is the first large-scale Neo-Latin epic ever finished: thirteen books, written in the 1450s, on the wars of Sigismondo Pandolfo Malatesta, lord of Rimini, against Alfonso of Aragon, in Virgil's own manner and with the full machinery of gods, councils and descents to the underworld. Basinio lies buried beside Sigismondo's Tempio Malatestiano.

  This edition prints Basinio's Latin from Drudi's 1794 edition with an English translation made for this edition. The poem has never before appeared in English.

meleagris: |
  Basinio da Parma's <i>Meleagris</i>, a youthful Latin epic in three books on Meleager and the hunt of the Calydonian boar, written in the manner of Ovid and Statius.

  This edition prints Basinio's Latin from Drudi's 1794 edition with an English translation made for this edition, the first in English.

argonauticon: |
  Basinio da Parma's unfinished Latin epic of Jason and the Argonauts, after Apollonius and Valerius Flaccus, of which the opening books survive.

  This edition prints the Latin from Drudi's 1794 edition with an English translation made for this edition, the first in English.

astronomicon: |
  Basinio da Parma's <i>Astronomicon</i>, a Latin didactic poem in two books on the constellations and planets, written for Sigismondo Malatesta in the tradition of Manilius.

  This edition prints the Latin from Drudi's 1794 edition with an English translation made for this edition, the first in English.

africa: |
  Petrarch's <i>Africa</i> is the epic for which he was crowned poet laureate on the Capitol in 1341: Scipio Africanus' war against Hannibal, told in Latin hexameters in conscious rivalry with Virgil. Petrarch never finished it and would not let it circulate in his lifetime, but it stands at the very beginning of Renaissance humanism.

  This edition prints Petrarch's Latin with an English translation made for this edition.

urania: |
  Giovanni Pontano's <i>Urania</i> (published 1505) is the most ambitious astronomical poem of the Renaissance: five books of Latin hexameters on the heavens, the constellations, the planets and their influence on human lives, by the humanist who led the Neapolitan Academy.

  This edition prints Pontano's Latin with an English translation made for this edition.

parthenopeus: |
  <i>Parthenopeus</i>, also called <i>Amores</i>, is Giovanni Pontano's youthful book of Latin love elegies, written in Naples in the manner of Catullus, Ovid and Propertius.

  This edition prints Pontano's Latin with an English translation made for this edition.

de-hortis-hesperidum: |
  Giovanni Pontano's <i>De hortis Hesperidum</i> (1501) is a Virgilian georgic on growing citrus, the golden apples of the Hesperides, in the gardens of Campania, and one of the most charming Latin poems of the Renaissance.

  This edition prints Pontano's Latin with an English translation made for this edition.

greek-epigrams:
  hold: >-
    The Greek was machine-read from a 1553 printing and only about a fifth of it
    survives the reading; the closing pages are unreadable. Re-source the text
    before listing.

der-letzte-ritter: |
  Anastasius Grün (Count Anton Alexander von Auersperg) made his name with <i>Der letzte Ritter</i> (1830), a cycle of Romanzen on Emperor Maximilian I, "the last knight", from his birth in Wiener Neustadt through his wooing of Mary of Burgundy and his adventures to his funeral at Wels. It shaped the image of Maximilian for the whole nineteenth century, and carries the liberal hopes of Vormärz Austria.

  This edition prints Grün's German with an English translation made for this edition.

der-letzte-ritter-and-the-murtenlied: |
  Anastasius Grün's <i>Der letzte Ritter</i> (1830), the cycle of Romanzen on Emperor Maximilian I that made Grün's name, together with Veit Weber's song of the Battle of Murten (1476), in which the Swiss destroyed the army of Maximilian's father-in-law, Charles the Bold.

  Grün's German is printed with an English translation made for this edition; Weber's Alemannic song with C. C. Felton's 1845 English ballad version.

de-modo-usurarum-liber: |
  Claude Saumaise (Claudius Salmasius), the most learned scholar of seventeenth-century Europe, argued in <i>De modo usurarum</i> (1639) that lending at interest is lawful and necessary, against a thousand years of canon law, and backed the argument with the whole of ancient economic history. Its influence on Dutch and English thinking about credit was considerable.

  This edition is an English rendering made by machine and restyled for readability. It is in English only; a small number of passages could not be translated and are marked in the text.

# ------------------------------------------------------------------ facsimiles

warsofmarlboroug01tayl-facsimile: |
  Frank Taylor's <i>The Wars of Marlborough, 1702–1709</i> (Oxford, 1921) is the classic study of the Duke of Marlborough's campaigns in the War of the Spanish Succession, from the opening campaigns in the Low Countries to the march to the Danube and Blenheim.

  Volume I, reproduced in facsimile from the 1921 edition.

warsofmarlboroug02tayl-facsimile: |
  The second volume of Frank Taylor's <i>The Wars of Marlborough, 1702–1709</i> (Oxford, 1921), carrying the story through Ramillies, Oudenarde and Malplaquet.

  Volume II, reproduced in facsimile from the 1921 edition.

# ------------------------------------------------------------------- Rhodoman
# The shared Rhodoman paragraph and the machine-English disclosure are added
# by make_catalogue.py, so each of these says only what the poem is.

lutherus: |
  Rhodoman's <i>Lutherus</i> is a didactic poem in two books of Homeric hexameters on the life and work of Martin Luther, the most substantial of his Protestant poems.

theologia-christiana: |
  A theological didactic poem in Greek hexameters setting out Christian doctrine, preserved in manuscript.

arion: |
  A Doric epyllion on the legend of the poet Arion, thrown overboard by sailors and carried to shore by a dolphin who had heard him sing.

ilias-parva-part-i: |
  The first part of Rhodoman's <i>Ilias parva</i> (1604): verse summaries of Homer's <i>Iliad</i>, book by book, in Greek and Latin.

ilias-parva-part-ii: |
  The second part of the <i>Ilias parva</i> (1604): verse summaries of Quintus of Smyrna's <i>Posthomerica</i>, the epic of the fall of Troy, whose text Rhodoman himself edited.

historia-ecclesiae: |
  A history of the Church in Greek verse.

hymnus-scholasticus: |
  A school hymn in Greek and Latin, written for the pupils Rhodoman taught.

dedicatory-poem-to-the-lutherus: |
  The Latin dedicatory poem that accompanies Rhodoman's Greek <i>Lutherus</i>.

ilfelda-hercynica: |
  A prize poem in praise of Ilfeld, the monastery school in the Harz where Rhodoman was taught by Michael Neander.

iter-lipsicum: |
  A Latin description of a journey to Leipzig.

dorian-lament-for-luther: |
  A funeral lament for Martin Luther in the Doric dialect of the Greek pastoral poets.

bioporikon: |
